<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f5">
  <title>College Club Management</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Clubhouse dashboard">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span><strong>Clubhouse</strong><small>COLLEGE COMMUNITY</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button class="nav-item" data-page="clubs"><span class="nav-icon">◈</span>Clubs</button>
        <button class="nav-item" data-page="members"><span class="nav-icon">◎</span>Members</button>
        <button class="nav-item" data-page="events"><span class="nav-icon">▣</span>Events</button>
        <button class="nav-item" data-page="registrations"><span class="nav-icon">↗</span>Registrations</button>
      </nav>
      <div class="sidebar-foot"><span class="status-dot"></span> Campus operations</div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-divider">/</span><strong id="current-section">Overview</strong></div>
        <div class="topbar-note"><span class="live-dot"></span> Connected to club database</div>
      </header>

      <section id="page-content" class="page-content" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="record-dialog" class="record-dialog">
    <form id="record-form">
      <div class="dialog-heading">
        <div><div class="eyebrow" id="dialog-eyebrow">NEW RECORD</div><h2 id="dialog-title">Add item</h2></div>
        <button type="button" class="icon-button" id="close-dialog" aria-label="Close form">×</button>
      </div>
      <div id="form-fields" class="form-fields"></div>
      <div class="dialog-actions">
        <button type="button" class="button button-quiet" id="cancel-dialog">Cancel</button>
        <button type="submit" class="button button-primary" id="save-record">Save record</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
